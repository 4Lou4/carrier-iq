version: 2

sources:
  - name: raw
    description: >
      Landing zone written by dlt. **At-least-once by design**: it may contain the
      same event more than once, whether because upstream re-delivered it or because
      the incremental cursor re-read its closed boundary. No uniqueness is asserted
      here — asserting it would be a lie about what the layer is for.
    schema: raw
    tables:
      - name: call_events
        description: One row per delivered call attempt, exactly as it arrived.
        # Freshness SLO.
        #
        # Read what this actually measures before quoting it. loaded_at_field is
        # occurred_at, which is when the call happened — not when the row was
        # written. So this watches **event freshness**: how far behind reality the
        # warehouse is, end to end. A stalled generator, a stalled ingestion and a
        # stalled load all show up here, because all three stop new events arriving.
        #
        # What it cannot see is a load that succeeds while replaying old events: the
        # rows are fresh, the events are not, and this SLO stays green. Watching
        # _dlt_load_id timestamps instead would catch that and miss the first three.
        # Event freshness is the right choice for a pipeline whose job is to inform a
        # decision every fifteen minutes, but it is a choice, and the two are worth
        # being able to tell apart out loud.
        loaded_at_field: occurred_at
        freshness:
          # Two intervals, not one, and the gap between them is the point: the warning
          # is a signal to look, the error is a signal to stop.
          warn_after: { count: 2, period: hour }
          error_after: { count: 6, period: hour }
        columns:
          - name: event_id
            description: Deterministic event identifier. Not unique in this layer.
          - name: occurred_at
            description: Instant of the attempt, timezone-aware. Always UTC at source.
          - name: buy_rate_eur_per_min
            description: >
              Purchase rate. **Nullable**, and the nulls are the point: the audit that
              motivated this project found it missing on a fifth of billable calls.
