version: 2

models:
  - name: stg_call_events
    description: >
      One row per call attempt, deduplicated, typed, and pinned to UTC. This is the
      first layer where uniqueness holds, and the tests below are what prove it.
    columns:
      - name: event_id
        description: Event identifier. Unique **here**, unlike in the source.
        data_tests:
          - unique
          - not_null
      - name: occurred_at_utc
        description: Instant of the attempt, naive timestamp in UTC.
        data_tests: [not_null]
      - name: interval_start_utc
        description: Start of the 15-minute bucket the attempt falls into, in UTC.
        data_tests: [not_null]
      - name: carrier_code
        data_tests: [not_null]
      - name: destination_code
        data_tests: [not_null]
      - name: origin_cc
        description: Calling country code. Part of the decision key, because some
          carriers price the same destination differently depending on it.
        data_tests: [not_null]
      - name: service_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["economy", "standard", "premium", "critical"]
      - name: disposition
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["answered", "no_answer", "busy", "failed", "congestion"]
      - name: billable_seconds
        data_tests: [not_null]
      - name: sell_rate_eur_per_min
        data_tests: [not_null]
      - name: buy_rate_eur_per_min
        description: Nullable on purpose. Its coverage is asserted by a singular test.
      - name: margin_eur_per_min
        description: Null wherever the purchase rate is missing. Never coalesced.

  - name: stg_call_events_quarantine
    description: >
      Deliveries that arrived unreadable, kept rather than dropped, each labelled with
      the reason it was rejected. This is the dead letter queue: it is what stops one
      damaged row from failing a whole load, and what stops the same row from
      corrupting an aggregate. Its **volume** is asserted by a singular test, because
      a queue that grows silently turns a loud upstream failure into a quiet
      undercount.
    columns:
      - name: quarantine_reason
        description: Why the row could not be read. Defined once, in the
          quarantine_reason macro, and shared with stg_call_events.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing_event_id
                  - negative_billable_seconds
                  - occurred_in_the_future
      - name: _dlt_load_id
        description: The load that carried the rejected delivery, kept so it can be
          traced back rather than merely counted.
        data_tests: [not_null]
